tion / Distance / Validation</text><text x="222" y="461" fill="#595959">No elevation dataset loaded</text><text x="222" y="491" fill="#595959">Route calculations require a validated local engine.</text><text x="222" y="529" fill="#595959">Illustrative geometry only · not a navigation route</text></g><path d="M204 55V568M774 55V568M204 405H774" stroke="#c5c9bf"/><text x="219" y="393" font-size="10" fill="#595959">Schematic map · © OpenStreetMap contributors in production</text></svg>