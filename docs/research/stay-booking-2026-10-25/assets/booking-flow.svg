<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Where booking complexity begins</title><desc id="desc">Recommended: discover, open provider, provider verifies price and takes payment, provider confirms and supports. A native booking integration additionally needs quote acceptance, safe submission, unknown-outcome reconciliation and cancellation handling; it is outside the proposed MVP.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c93"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16384d;font-size:16px}.head{font-size:20px;font-weight:700}.small{font-size:14px}.box{fill:#fff;stroke:#b7cfda;stroke-width:1.5}.line{fill:none;stroke:#226c93;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1000" height="330" rx="16" fill="#eaf3f7"/><text x="25" y="35" class="head">Recommended handoff</text><rect class="box" x="25" y="55" width="205" height="72" rx="9"/><text x="47" y="86">Choose a property</text><text x="47" y="109" class="small">On device</text><path class="line" d="M237 91H267"/><rect class="box" x="275" y="55" width="205" height="72" rx="9"/><text x="297" y="86">Open provider</text><text x="297" y="109" class="small">Explicit external handoff</text><path class="line" d="M487 91H517"/><rect class="box" x="525" y="55" width="205" height="72" rx="9"/><text x="545" y="86">Check price &amp; pay</text><text x="545" y="109" class="small">Provider owns checkout</text><path class="line" d="M737 91H767"/><rect class="box" x="775" y="55" width="200" height="72" rx="9"/><text x="793" y="86">Confirm &amp; support</text><text x="793" y="109" class="small">Provider owns reservation</text><text x="25" y="183" class="head">Native booking: future feasibility only</text><text x="25" y="218">Fresh quote → terms accepted → submit once → confirmed / failed / unknown</text><path class="line" d="M825 228V270H450"/><text x="25" y="287">Unknown outcome: retrieve status before any retry</text><text x="25" y="312" class="small">Refunds, cancellations, authentication and servicing remain ongoing obligations.</text></svg>