<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Recommended architecture: public catalogue, private journey</title><desc id="desc">The Manotu server distributes licensed public property content. The phone holds saved stays and trip plans. On an explicit tap, the phone opens the provider for search, payment and support. No reservation callback is sent to Manotu.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c93"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16384d;font-size:16px}.head{font-size:20px;font-weight:700}.small{font-size:14px}.box{fill:#fff;stroke:#b7cfda;stroke-width:1.5}.line{fill:none;stroke:#226c93;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1000" height="360" rx="16" fill="#eaf3f7"/><rect x="22" y="22" width="292" height="316" rx="12" fill="#d5eee7"/><text x="43" y="56" class="head">Traveller’s device</text><text x="43" y="90">Map and property selection</text><text x="43" y="120">Saved stay / dates / trip plan</text><text x="43" y="150">Room or GRDB, local only</text><text x="43" y="302" class="small">No booking history on our servers</text><rect class="box" x="400" y="22" width="565" height="124" rx="12"/><text x="425" y="57" class="head">Manotu: licensed public catalogue</text><text x="425" y="90">Provider IDs, permitted content, rights metadata</text><text x="425" y="120">No guest records or personalized redirect logs</text><path class="line" d="M400 110H323"/><text x="328" y="94" class="small">Content</text><rect class="box" x="400" y="210" width="565" height="128" rx="12"/><text x="425" y="245" class="head">Booking provider: external browser / app</text><text x="425" y="279">Live search, guest details, payment, confirmation</text><text x="425" y="309">Changes, cancellations and customer support</text><path class="line" d="M314 255H391"/><text x="321" y="237" class="small">User tap</text><path d="M600 155V199" stroke="#9e6337" stroke-width="2" stroke-dasharray="5 5"/><path d="M592 169L608 185M608 169L592 185" stroke="#9e6337" stroke-width="3"/></svg>