<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Two directions through the travel market</title><desc id="desc">Demand APIs help travellers find and buy stays. Supply APIs help hosts publish and manage their own inventory. A supply connection does not grant a licence to resell the marketplace.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c93"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#16384d;font-size:16px}.head{font-size:20px;font-weight:700}.small{font-size:14px}.box{fill:#fff;stroke:#b7cfda;stroke-width:1.5}.line{fill:none;stroke:#226c93;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1000" height="290" rx="16" fill="#eaf3f7"/><text x="28" y="36" class="head">Demand: selling stays to travellers</text><rect class="box" x="28" y="58" width="235" height="68" rx="9"/><text x="52" y="98">Manotu traveller discovery</text><path class="line" d="M270 92H365"/><rect class="box" x="375" y="58" width="250" height="68" rx="9"/><text x="400" y="98">Licensed demand partner</text><path class="line" d="M635 92H730"/><rect class="box" x="740" y="58" width="230" height="68" rx="9"/><text x="763" y="98">Provider checkout</text><text x="28" y="174" class="head">Supply: managing a host’s properties</text><rect class="box" x="28" y="196" width="235" height="68" rx="9"/><text x="52" y="236">Host / property manager</text><path class="line" d="M270 230H365"/><rect class="box" x="375" y="196" width="250" height="68" rx="9"/><text x="398" y="236">PMS / channel manager</text><path class="line" d="M635 230H730"/><rect class="box" x="740" y="196" width="230" height="68" rx="9"/><text x="768" y="236">OTA host inventory</text></svg>