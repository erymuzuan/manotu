# Gimano production stack (172.30.30.150), image-based. See deploy/PRODUCTION.md.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod --profile tools run --rm importer
#
# Only the API is published (on the LAN interface, for IIS ARR on 172.30.30.13). PostGIS and Valhalla run here with no
# host ports. RabbitMQ and OpenSearch are the SHARED instances on 172.30.30.149 (vhost "gimano", index prefix "gimano-"),
# configured via RABBITMQ_* / OPENSEARCH_* in deploy/.env.prod. Self-hosters can run local ones with --profile local-infra
# (see .env.prod.example for the matching values).
# Sized for a shared host (6 vCPU, ~13 GiB free RAM, < 10 GB of volumes): every service has a memory limit.
name: gimano

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  ConnectionStrings__Postgres: "Host=postgis;Port=5432;Database=gimano;Username=gimano;Password=${POSTGRES_PASSWORD:?};Command Timeout=300;GSS Encryption Mode=Disable"
  OpenSearch__Url: "${OPENSEARCH_URL:?Set OPENSEARCH_URL in deploy/.env.prod}"
  OpenSearch__User: "${OPENSEARCH_USER:-gimano}"
  OpenSearch__Password: "${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD in deploy/.env.prod}"
  OpenSearch__IndexPrefix: "${OPENSEARCH_INDEX_PREFIX:-gimano-}"
  OpenSearch__Replicas: "${OPENSEARCH_REPLICAS:-0}"   # .149 is a single node
  OpenSearch__AllowInvalidCertificate: "${OPENSEARCH_ALLOW_INVALID_CERT:-false}"   # only for this connection (demo cert on .149)
  RabbitMq__Host: "${RABBITMQ_HOST:?Set RABBITMQ_HOST in deploy/.env.prod}"
  RabbitMq__Port: "${RABBITMQ_PORT:-5672}"
  RabbitMq__VirtualHost: "${RABBITMQ_VHOST:-gimano}"
  RabbitMq__User: "${RABBITMQ_USER:-gimano}"
  RabbitMq__Password: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env.prod}"
  Media__Root: /data/media

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: gimano
      POSTGRES_USER: gimano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.prod}
    # Default durability (fsync on, synchronous_commit on). Modest memory for a shared host.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB", "-c", "work_mem=16MB",
              "-c", "maintenance_work_mem=256MB", "-c", "max_wal_size=2GB", "-c", "max_connections=100"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [gimano]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gimano -d gimano"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  # ---- local-infra profile: only for self-hosting without the shared .149 services --------------------------------
  opensearch:
    profiles: ["local-infra"]
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    logging: *logging
    # Security plugin ON (TLS + basic auth with the admin password below), and no host port at all.
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: ["osdata:/usr/share/opensearch/data"]
    networks: [gimano]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2g }

  rabbitmq:
    profiles: ["local-infra"]
    image: rabbitmq:4-management
    restart: unless-stopped
    logging: *logging
    hostname: gimano-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gimano}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-gimano}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.6"
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    networks: [gimano]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }

  # First start downloads the Geofabrik extract and builds tiles (~20–40 min with 2 threads). The PBF is not needed
  # afterwards (use_tiles_ignore_pbf) and can be deleted to save ~250 MB (PRODUCTION.md).
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    logging: *logging
    environment:
      tile_urls: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
      server_threads: "2"
      serve_tiles: "True"
    volumes: ["valhalla:/custom_files"]
    networks: [gimano]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 120
      start_period: 60m
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  api:
    image: ${REGISTRY:?}/gimano-api:${TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      Urls: "http://+:8080"
      Valhalla__Url: "http://valhalla:8002"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env.prod}
      PublicBaseUrl: ${PUBLIC_BASE_URL:-https://gimano-api.bukitbunga.com}
      Proxy__TrustedProxies: ${TRUSTED_PROXIES:?Set TRUSTED_PROXIES (IIS ARR address) in deploy/.env.prod}
      Cors__ShareViewerOrigins: ${SHARE_VIEWER_ORIGINS:-https://www.bukitbunga.com}
      RateLimit__PermitsPerMinute: ${RATE_LIMIT_PER_MINUTE:-600}
      Kestrel__Limits__MaxRequestBodySize: "4194304"
      # (no container healthcheck: the runtime image has no curl; monitor https://…/readyz instead)
      Features__ApiDocs: "false"
      Features__LegacySavedPlaces: ${LEGACY_SAVED_PLACES:-true}
      # Per-account enforcement: keyed accounts must always sign. Legacy key-less accounts (0.1.0 apps) may post
      # unsigned (capped at baharu) while ALLOW_LEGACY_UNSIGNED=true. REQUIRE_SIGNATURES=true is the kill switch
      # that rejects every unsigned request, legacy included.
      Identity__RequireSignatures: ${REQUIRE_SIGNATURES:-false}
      Identity__AllowLegacyUnsigned: ${ALLOW_LEGACY_UNSIGNED:-true}
      Feedback__ContactKey: ${FEEDBACK_CONTACT_KEY:?Set FEEDBACK_CONTACT_KEY in deploy/.env.prod}
      Admin__Key: ${ADMIN_KEY:-}
      # Opaque per-author handles for on-device blocking (base64, 32 bytes). Empty = derived from the JWT key (then rotating
      # the JWT key changes every handle and empties the apps' block lists). openssl rand -base64 32
      Community__AuthorHandleKey: ${AUTHOR_HANDLE_KEY:-}
      # Event short links (docs/events.md §5.6): key for the uploader hash (quota, DELETE /me). Empty = derived from the
      # JWT key (rotating it would orphan live links from their owners). openssl rand -base64 32
      Drops__OwnerKey: ${DROPS_OWNER_KEY:-}
      # Agent endpoints /admin/v1 and /mcp (docs/back-office.md): OFF in production until the back office is deliberately
      # deployed here. To enable, set AGENT_ADMIN_ENABLED=true and AGENT_ADMIN_NETWORKS to the agents' CIDR (Tailscale:
      # 100.64.0.0/10) in deploy/.env.prod. Requests through Cloudflare are refused either way (Admin__AllowPublic=false).
      Admin__Enabled: ${AGENT_ADMIN_ENABLED:-false}
      Admin__AllowPublic: "false"
      Admin__AllowedNetworks__0: ${AGENT_ADMIN_NETWORKS:-127.0.0.1/32}
      Search__AliasesPath: /data/search/aliases.csv
      Attestation__Mode: ${ATTESTATION_MODE:-log}
      Attestation__Android__PackageName: ${ATTESTATION_ANDROID_PACKAGE:-}
      Attestation__Android__ServiceAccountJson: ${ATTESTATION_ANDROID_SA_JSON:-}
      Attestation__Ios__AppId: ${ATTESTATION_IOS_APP_ID:-}
      # AI place check (docs/api.md "Community places"; docs/supply-chain.md): Claude Haiku 5.5, at most US$20 a week.
      # Empty key = off (places follow the plain vetting rules). Launch mode: 1 confirmation, 90-day expiry.
      Screening__ApiKey: ${CLAUDE_API_KEY:-}
      Screening__WeeklyBudgetUsd: ${SCREENING_WEEKLY_BUDGET_USD:-20}
      Vetting__LaunchMode: ${VETTING_LAUNCH_MODE:-true}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    ports: ["${API_BIND:?Set API_BIND (the host's LAN IP) in deploy/.env.prod}:${API_PORT:-5080}:8080"]
    volumes: ["media:/data/media"]
    networks: [gimano]
    depends_on:
      postgis: { condition: service_healthy }
      valhalla: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 768m }

  worker:
    image: ${REGISTRY:?}/gimano-worker:${TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      # No GitHub-issue sink in production: feedback is free text a user may fill with personal details, and the privacy
      # policy promises it goes only to us. (The worker also refuses it outside Development unless explicitly allowed.)
      # Maintainer digest (docs/back-office.md): one counts-only email a day + moderation alerts, through Azure Communication
      # Services. Off unless both the connection string and a recipient are set.
      Digest__AcsConnectionString: ${DIGEST_ACS_CONNECTION_STRING:-}
      Digest__From: ${DIGEST_FROM:-DoNotReply@bukitbunga.com}
      Digest__To__0: ${DIGEST_TO:-}
      Digest__SendAtHour: ${DIGEST_SEND_AT_HOUR:-8}
      Digest__BackOfficeUrl: ${BACKOFFICE_PUBLIC_URL:-http://127.0.0.1:5090}
      # The worker finishes AI checks that took longer than 4 s (same key and budget as the api).
      Screening__ApiKey: ${CLAUDE_API_KEY:-}
      Screening__WeeklyBudgetUsd: ${SCREENING_WEEKLY_BUDGET_USD:-20}
      Vetting__LaunchMode: ${VETTING_LAUNCH_MODE:-true}
    volumes: ["media:/data/media"]
    networks: [gimano]
    depends_on:
      api: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536m }   # in-memory road index ≈ 450 MB

  # Maintainer back office (Blazor): feedback, crash groups, replies, agent tokens (docs/back-office.md). Never public:
  # bind it to 127.0.0.1 (reach it with `tailscale serve` or an SSH tunnel) or to an address only the VPN reaches.
  backoffice:
    image: ${REGISTRY:?}/gimano-backoffice:${TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      Urls: "http://+:8080"
      # Same key as the api: needed to reveal volunteered contacts (with a reason, audited).
      Feedback__ContactKey: ${FEEDBACK_CONTACT_KEY:?Set FEEDBACK_CONTACT_KEY in deploy/.env.prod}
      BackOffice__Maintainers__0: ${BACKOFFICE_MAINTAINERS:-}
      # Shown on "Agent access" as the API address agents use for /mcp (the api as reached over the tailnet).
      BackOffice__ApiBaseUrl: ${BACKOFFICE_API_BASE_URL:-http://172.30.30.150:5080}
      # Base of the one-time invite links printed by `run --rm backoffice invite <email>`.
      BackOffice__PublicUrl: ${BACKOFFICE_PUBLIC_URL:-http://127.0.0.1:5090}
      DataProtection__KeysPath: /data/keys
    ports: ["${BACKOFFICE_BIND:-127.0.0.1}:${BACKOFFICE_PORT:-5090}:8080"]
    volumes: ["backofficekeys:/data/keys"]
    networks: [gimano]
    depends_on:
      api: { condition: service_started }   # the API applies the main EF migrations; the back office migrates only its own schema
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }

  importer:
    profiles: ["tools"]
    image: ${REGISTRY:?}/gimano-importer:${TAG:?}
    logging: *logging
    environment:
      <<: *app-env
      GIMANO_PBF: /data/osm/malaysia-singapore-brunei-latest.osm.pbf
      GIMANO_TOLLS: /data/tolls/my-toll-rates.csv
      OpenSearch__TimeoutSeconds: "300"
    volumes: ["../data/osm:/data/osm", "../data/tolls:/data/tolls"]
    networks: [gimano]
    depends_on:
      postgis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4g }

networks:
  gimano: {}

volumes:
  pgdata:
  osdata:
  rabbitdata:
  valhalla:
  media:
  backofficekeys:   # ASP.NET Data Protection keys for back-office sign-in cookies
